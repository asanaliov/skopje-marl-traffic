<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description">
  <title id="title">Mean average waiting time by traffic scenario for all controllers</title>
  <desc id="description">Line chart comparing all eight controller labels in the experiment results across low, medium, and high synthetic demand. Lower waiting time is better. Imported actuated has the lowest mean in all three scenarios.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#182230">Mean average waiting time by scenario</text>
  <text x="500" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#526174">Seconds, lower is better · all eight controller labels</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#526174" text-anchor="end">
    <text x="83" y="384">0</text><text x="83" y="314">5</text><text x="83" y="244">10</text><text x="83" y="174">15</text><text x="83" y="104">20</text>
  </g>
  <g stroke="#dbe2ea" stroke-width="1">
    <line x1="95" y1="380" x2="715" y2="380"/><line x1="95" y1="310" x2="715" y2="310"/>
    <line x1="95" y1="240" x2="715" y2="240"/><line x1="95" y1="170" x2="715" y2="170"/>
    <line x1="95" y1="100" x2="715" y2="100"/>
  </g>
  <g stroke="#748195" stroke-width="1.5"><line x1="95" y1="100" x2="95" y2="380"/><line x1="95" y1="380" x2="715" y2="380"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#344054" text-anchor="middle">
    <text x="170" y="405">Low</text><text x="405" y="405">Medium</text><text x="640" y="405">High</text>
    <text x="405" y="432" font-size="12" fill="#526174">Synthetic traffic demand</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <polyline points="170,272.9 405,235.4 640,167.6" stroke="#667085"/>
    <polyline points="170,319.7 405,295.9 640,233.8" stroke="#16856b"/>
    <polyline points="170,317.6 405,283.5 640,219.8" stroke="#2878b5"/>
    <polyline points="170,302.6 405,245.2 640,189.6" stroke="#d17b18"/>
    <polyline points="170,298.2 405,278.6 640,183.9" stroke="#8b5fbf"/>
    <polyline points="170,306.2 405,230.3 640,138.5" stroke="#c43c55"/>
    <polyline points="170,297.3 405,238.9 640,179.7" stroke="#168aad"/>
    <polyline points="170,306.1 405,276.1 640,202.5" stroke="#7652a5"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5">
    <g fill="#667085"><circle cx="170" cy="272.9" r="4.5"/><circle cx="405" cy="235.4" r="4.5"/><circle cx="640" cy="167.6" r="4.5"/></g>
    <g fill="#16856b"><circle cx="170" cy="319.7" r="4.5"/><circle cx="405" cy="295.9" r="4.5"/><circle cx="640" cy="233.8" r="4.5"/></g>
    <g fill="#2878b5"><circle cx="170" cy="317.6" r="4.5"/><circle cx="405" cy="283.5" r="4.5"/><circle cx="640" cy="219.8" r="4.5"/></g>
    <g fill="#d17b18"><circle cx="170" cy="302.6" r="4.5"/><circle cx="405" cy="245.2" r="4.5"/><circle cx="640" cy="189.6" r="4.5"/></g>
    <g fill="#8b5fbf"><circle cx="170" cy="298.2" r="4.5"/><circle cx="405" cy="278.6" r="4.5"/><circle cx="640" cy="183.9" r="4.5"/></g>
    <g fill="#c43c55"><circle cx="170" cy="306.2" r="4.5"/><circle cx="405" cy="230.3" r="4.5"/><circle cx="640" cy="138.5" r="4.5"/></g>
    <g fill="#168aad"><circle cx="170" cy="297.3" r="4.5"/><circle cx="405" cy="238.9" r="4.5"/><circle cx="640" cy="179.7" r="4.5"/></g>
    <g fill="#7652a5"><circle cx="170" cy="306.1" r="4.5"/><circle cx="405" cy="276.1" r="4.5"/><circle cx="640" cy="202.5" r="4.5"/></g>
  </g>

  <g font-family="Arial, sans-serif" font-size="12.5" fill="#344054">
    <line x1="750" y1="115" x2="778" y2="115" stroke="#667085" stroke-width="3"/><text x="787" y="119">static_fixed_time</text>
    <line x1="750" y1="148" x2="778" y2="148" stroke="#16856b" stroke-width="3"/><text x="787" y="152">imported_actuated</text>
    <line x1="750" y1="181" x2="778" y2="181" stroke="#2878b5" stroke-width="3"/><text x="787" y="185">independent_rl</text>
    <line x1="750" y1="214" x2="778" y2="214" stroke="#d17b18" stroke-width="3"/><text x="787" y="218">multi_agent_independent_rl</text>
    <line x1="750" y1="247" x2="778" y2="247" stroke="#8b5fbf" stroke-width="3"/><text x="787" y="251">multi_agent_spatial_rl</text>
    <line x1="750" y1="280" x2="778" y2="280" stroke="#c43c55" stroke-width="3"/><text x="787" y="284">marl_neighbor_reward</text>
    <line x1="750" y1="313" x2="778" y2="313" stroke="#168aad" stroke-width="3"/><text x="787" y="317">marl_global_reward</text>
    <line x1="750" y1="346" x2="778" y2="346" stroke="#7652a5" stroke-width="3"/><text x="787" y="350">marl_deep_ppo</text>
  </g>
  <text x="500" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#667085">Means include all recorded rows, including repeated seed-42 rows in some controller/scenario groups.</text>
</svg>
