<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title description">
  <title id="title">Mean average waiting time by traffic scenario</title>
  <desc id="description">Line chart of average waiting time in seconds for five traffic controllers under low, medium, and high synthetic demand. Lower values indicate less waiting. Imported actuated has the lowest mean in all scenarios.</desc>
  <rect width="1000" height="490" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#182230">Mean average waiting time by scenario</text>
  <text x="500" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#526174">Seconds, lower is better · means of recorded seed 42/43/44 rows</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#526174" text-anchor="end">
    <text x="83" y="384">0</text><text x="83" y="314">4</text><text x="83" y="244">8</text><text x="83" y="174">12</text><text x="83" y="104">16</text>
  </g>
  <g stroke="#dbe2ea" stroke-width="1">
    <line x1="95" y1="380" x2="715" y2="380"/><line x1="95" y1="310" x2="715" y2="310"/>
    <line x1="95" y1="240" x2="715" y2="240"/><line x1="95" y1="170" x2="715" y2="170"/>
    <line x1="95" y1="100" x2="715" y2="100"/>
  </g>
  <g stroke="#748195" stroke-width="1.5"><line x1="95" y1="100" x2="95" y2="380"/><line x1="95" y1="380" x2="715" y2="380"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#344054" text-anchor="middle">
    <text x="170" y="405">Low</text><text x="405" y="405">Medium</text><text x="640" y="405">High</text>
    <text x="405" y="432" font-size="12" fill="#526174">Synthetic traffic demand</text>
  </g>

  <g fill="none" stroke-width="3">
    <polyline points="170,246.1 405,199.2 640,114.5" stroke="#667085"/>
    <polyline points="170,304.6 405,274.8 640,197.3" stroke="#16856b"/>
    <polyline points="170,302.0 405,259.4 640,180.3" stroke="#2878b5"/>
    <polyline points="170,283.2 405,211.8 640,142.0" stroke="#d17b18"/>
    <polyline points="170,287.6 405,250.2 640,158.1" stroke="#8b5fbf"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <g fill="#667085"><circle cx="170" cy="246.1" r="5"/><circle cx="405" cy="199.2" r="5"/><circle cx="640" cy="114.5" r="5"/></g>
    <g fill="#16856b"><circle cx="170" cy="304.6" r="5"/><circle cx="405" cy="274.8" r="5"/><circle cx="640" cy="197.3" r="5"/></g>
    <g fill="#2878b5"><circle cx="170" cy="302.0" r="5"/><circle cx="405" cy="259.4" r="5"/><circle cx="640" cy="180.3" r="5"/></g>
    <g fill="#d17b18"><circle cx="170" cy="283.2" r="5"/><circle cx="405" cy="211.8" r="5"/><circle cx="640" cy="142.0" r="5"/></g>
    <g fill="#8b5fbf"><circle cx="170" cy="287.6" r="5"/><circle cx="405" cy="250.2" r="5"/><circle cx="640" cy="158.1" r="5"/></g>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#344054">
    <line x1="755" y1="125" x2="785" y2="125" stroke="#667085" stroke-width="3"/><text x="795" y="129">Fixed-time</text>
    <line x1="755" y1="160" x2="785" y2="160" stroke="#16856b" stroke-width="3"/><text x="795" y="164">Imported actuated</text>
    <line x1="755" y1="195" x2="785" y2="195" stroke="#2878b5" stroke-width="3"/><text x="795" y="199">Single-agent RL</text>
    <line x1="755" y1="230" x2="785" y2="230" stroke="#d17b18" stroke-width="3"/><text x="795" y="234">8-agent tabular RL</text>
    <line x1="755" y1="265" x2="785" y2="265" stroke="#8b5fbf" stroke-width="3"/><text x="795" y="269">8-agent deep PPO</text>
  </g>
  <text x="500" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#667085">Some controller/scenario groups contain repeated seed-42 rows; all recorded rows are included in the means.</text>
</svg>
